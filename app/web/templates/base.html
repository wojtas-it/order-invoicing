<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Zamówienia{% endblock %} · Order Invoicing</title>
  <link rel="stylesheet" href="{{ url_for('static', path='style.css') }}">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/">Order Invoicing</a>
    <nav>
      <a href="/">Zamówienia</a>
      <a href="/invoices">Faktury</a>

    {% block content %}{% endblock %}
  </main>
</body>
</html>
